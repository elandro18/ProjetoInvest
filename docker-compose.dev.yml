services:
  postgres:
    image: postgres:16-alpine
    container_name: investcontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invest
      POSTGRES_PASSWORD: invest
      POSTGRES_DB: investcontrol
    ports:
      - "5433:5432"
    volumes:
      - investcontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invest -d investcontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  investcontrol_pgdata:
