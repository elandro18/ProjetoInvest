name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes com cobertura (gate de src/modules/**)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Auditoria de dependências (allowlist documentada)
        run: npm run audit

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invest
          POSTGRES_PASSWORD: invest
          POSTGRES_DB: investcontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invest -d investcontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://invest:invest@localhost:5432/investcontrol?schema=public
      DIRECT_URL: postgresql://invest:invest@localhost:5432/investcontrol?schema=public
      AUTH_SECRET: ci-e2e-secret-with-at-least-32-bytes-0000
      AUTH_URL: http://localhost:3100
      RATE_LIMIT_DESABILITADO: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client e aplicar migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Publicar relatório Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
